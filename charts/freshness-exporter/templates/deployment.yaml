apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "fe.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels: {{- include "fe.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "fe.selector" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: exporter
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: MONITOR_URL
              value: {{ required "monitorUrl is required" .Values.monitorUrl | quote }}
            - name: FETCH_TIMEOUT_SECONDS
              value: {{ .Values.fetchTimeoutSeconds | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: PORT
              value: {{ .Values.port | quote }}
          ports:
            - name: metrics
              containerPort: {{ .Values.port }}
          readinessProbe:
            tcpSocket: { port: metrics }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: metrics }
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
