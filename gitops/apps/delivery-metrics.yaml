apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: delivery-metrics
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://github.com/plewis22782/market-data-gitops.git
    targetRevision: main
    path: charts/delivery-metrics
    helm:
      valueFiles: [../../gitops/values/delivery-metrics.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: delivery
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
