# Pick up ServiceMonitors / PrometheusRules from every namespace, not only this release's.
prometheus:
  service:
    type: NodePort
    nodePort: 30090
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    retention: 45d          # > the 30-day SLO window
    storageSpec:
      # The kubelet creates a subPath dir as root on hostPath volumes, which uid 1000 can't
      # write. Mount the PV root instead; the host dir is owned by the same uid 1000.
      disableMountSubPath: true
      volumeClaimTemplate:
        spec:
          storageClassName: rack-retained   # static PV in gitops/platform, survives rebuilds
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 20Gi } }
grafana:
  # Admin credentials come from a secret cluster/bootstrap.sh generates, never from git.
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  service:
    type: NodePort
    nodePort: 30300
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
# k3s runs these inside the server process; there is nothing separate to scrape.
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
kubeEtcd: { enabled: false }
