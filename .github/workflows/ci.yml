name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["gitops/values/**"]   # tag bumps by the deploy job don't rebuild

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    strategy:
      matrix: { app: [freshness-exporter, delivery-metrics] }
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: "apps/${{ matrix.app }}" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check + unit-test the SLO rules
        run: |
          docker run --rm -v "$PWD/charts/freshness-exporter:/w" -w /w --entrypoint promtool \
            prom/prometheus:v3.5.0 check rules rules/slo.rules.yaml
          docker run --rm -v "$PWD/charts/freshness-exporter:/w" -w /w/tests --entrypoint promtool \
            prom/prometheus:v3.5.0 test rules slo_test.yaml

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.19.0 }
      - name: helm lint + render every chart with its real environment values
        run: |
          for c in freshness-exporter delivery-metrics; do
            helm lint "charts/$c" -f "gitops/values/$c.yaml"
            helm template "$c" "charts/$c" -f "gitops/values/$c.yaml"; echo "---"
          done > rendered.yaml
      - name: kubeconform (strict; CRDs from the datree catalog)
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml gitops/apps/*.yaml gitops/bootstrap/*.yaml gitops/platform/*.yaml
      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR cluster/*.sh

  image:
    needs: [python, rules, manifests]
    strategy:
      matrix: { app: [freshness-exporter, delivery-metrics] }
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.app }}:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    # GitOps hand-off: CI never touches the cluster. It commits the new tag; ArgoCD syncs it.
    if: github.event_name == 'push'
    needs: [image]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: bump image tags in gitops/values
        env: { TAG: "${{ needs.image.outputs.tag }}" }
        run: |
          for f in gitops/values/freshness-exporter.yaml gitops/values/delivery-metrics.yaml; do
            sed -i -E "s/^(  tag: ).*/\1\"${TAG}\"/" "$f"
          done
          git diff --exit-code && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: platform ${TAG}"
          git push
