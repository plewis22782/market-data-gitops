name: ci

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ["gitops/values/**"]   # tag bumps by the deploy job don't rebuild

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/freshness-exporter

jobs:
  exporter:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/freshness-exporter } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check + unit-test the SLO rules
        run: |
          docker run --rm -v "$PWD/charts/freshness-exporter:/w" -w /w --entrypoint promtool \
            prom/prometheus:v3.5.0 check rules rules/slo.rules.yaml
          docker run --rm -v "$PWD/charts/freshness-exporter:/w" -w /w/tests --entrypoint promtool \
            prom/prometheus:v3.5.0 test rules slo_test.yaml

  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.19.0 }
      - name: helm lint + render with the real environment values
        run: |
          helm lint charts/freshness-exporter -f gitops/values/freshness-exporter.yaml
          helm template fe charts/freshness-exporter -f gitops/values/freshness-exporter.yaml > rendered.yaml
      - name: kubeconform (strict; CRDs from the datree catalog)
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            rendered.yaml gitops/apps/*.yaml gitops/bootstrap/*.yaml
      - name: shellcheck
        run: shellcheck -x -P SCRIPTDIR cluster/*.sh

  image:
    needs: [exporter, rules, manifests]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: apps/freshness-exporter
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # GitOps hand-off: CI never touches the cluster. It commits the new tag; ArgoCD syncs it.
    if: github.event_name == 'push'
    needs: [image]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: bump image tag in gitops/values
        env: { TAG: "${{ needs.image.outputs.tag }}" }
        run: |
          sed -i -E "s/^(  tag: ).*/\1\"${TAG}\"/" gitops/values/freshness-exporter.yaml
          git diff --exit-code && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "deploy: freshness-exporter ${TAG}"
          git push
