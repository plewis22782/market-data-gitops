[project]
name = "freshness-exporter"
version = "0.1.0"
description = "Prometheus exporter for market-data recorder freshness"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
freshness-exporter = "freshness_exporter.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S104"]  # binding 0.0.0.0 is intended inside a container

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
